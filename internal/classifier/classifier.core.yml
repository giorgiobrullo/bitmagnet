$schema: "https://bitmagnet.io/schemas/classifier-0.1.json"
workflows:
  default:
    # delete torrents containing banned keywords:
    - if_else:
        condition: "([torrent.baseName] + torrent.files.map(f, f.basePath)).join(' ').matches(keywords.banned)"
        if_action: delete
    # try to identify content type for torrents without a hinted content type:
    - if_else:
        condition: "result.contentType == contentType.unknown"
        if_action:
          find_match:
            # detect JAV codes (e.g., SONE-436, FC2-PPV-4496995) — before extension-based detection:
            - detect_jav
            # match audiobooks:
            - if_else:
                condition:
                  and:
                    - "torrent.files.map(f, f.extension in extensions.audio ? f.size : - f.size).sum() > 50*mb"
                    - or:
                        - "torrent.baseName.matches(keywords.audiobook)"
                        - "torrent.files.filter(f, f.extension in extensions.audiobook).size() > 0"
                if_action:
                  set_content_type: audiobook
                else_action: unmatched
            # match comics:
            - if_else:
                condition: "torrent.files.map(f, f.extension in extensions.comic ? f.size : - f.size).sum() > 0"
                if_action:
                  set_content_type: comic
                else_action: unmatched
            # match ebooks:
            - if_else:
                condition: "torrent.files.map(f, f.extension in extensions.ebook ? f.size : - f.size).sum() > 0"
                if_action:
                  set_content_type: ebook
                else_action: unmatched
            # match music:
            - if_else:
                condition:
                  or:
                    - "torrent.files.map(f, f.extension in extensions.music ? f.size : - f.size).sum() > 0"
                    - and:
                        - "torrent.baseName.matches(keywords.music)"
                        - "torrent.files.map(f, f.extension in extensions.audio ? f.size : - f.size).sum() > 0"
                if_action:
                  set_content_type: music
                else_action: unmatched
            # match games:
            - if_else:
                condition:
                  or:
                    - "torrent.files.map(f, f.extension in extensions.game ? f.size : - f.size).sum() > 0"
                    - and:
                        - "([torrent.baseName] + torrent.files.map(f, f.basePath)).join(' ').matches(keywords.game)"
                        - "torrent.files.map(f, f.extension in extensions.video || f.extension in extensions.software ? f.size : - f.size).sum() > 100*mb"
                if_action:
                  set_content_type: game
                else_action: unmatched
            # match software:
            - if_else:
                condition: "torrent.files.map(f, f.extension in extensions.software ? f.size : - f.size).sum() > 0"
                if_action:
                  set_content_type: software
                else_action: unmatched
            # match xxx:
            - if_else:
                condition:
                  and:
                    - "torrent.files.map(f, (f.extension in extensions.video || f.extension in extensions.image) ? f.size : - f.size).sum() > 0"
                    - "([torrent.baseName] + torrent.files.map(f, f.basePath)).join(' ').matches(keywords.xxx)"
                if_action:
                  set_content_type: xxx
                else_action: unmatched
            # LLM fallback: classify content type when regex-based detection fails:
            - if_else:
                condition: "flags.apis_enabled && flags.llm_enabled"
                if_action: classify_with_llm
                else_action: unmatched
    # if the name contains a full date, attach it to the result as it's a good indicator of content type:
    - find_match:
        - parse_date
    # if we know a content ID that isn't already attached, try to attach it, either from the local `content` table or an API integration:
    - if_else:
        condition:
          and:
            - "torrent.hasHintedContentId && !result.hasAttachedContent"
            # we might as well save work by restricting this to content types that have an API integration:
            - "result.contentType in [contentType.movie, contentType.tv_show, contentType.xxx]"
        if_action:
          find_match:
            - attach_local_content_by_id
            - if_else:
                condition: "flags.apis_enabled && flags.tmdb_enabled"
                if_action: attach_tmdb_content_by_id
                else_action: unmatched
    # parse video-related attributes for video torrents (including the base title, needed for the next step):
    - if_else:
        condition:
          or:
            - "result.contentType in [contentType.movie, contentType.tv_show]"
            - "torrent.files.map(f, f.extension in extensions.video ? f.size : - f.size).sum() > 100*mb"
        if_action:
          find_match:
            # parse video-related attributes from the torrent name;
            # if the content type wasn't previously specified and the name format doesn't suggest a movie or TV show, a "no match" will be returned:
            - parse_video_content
            # LLM fallback: extract title/year when regex parsing fails:
            - if_else:
                condition: "flags.apis_enabled && flags.llm_enabled && !result.hasBaseTitle"
                if_action: classify_with_llm
                else_action: unmatched
    # LLM title extraction for non-video content that has a known type but no base title yet:
    - if_else:
        condition: "flags.apis_enabled && flags.llm_enabled && !result.hasBaseTitle && result.contentType != contentType.unknown"
        if_action: classify_with_llm
    # if content isn't already attached, and a base title has been parsed, then search for the content, either from the local `content` table or an API integration:
    - if_else:
        condition: "!result.hasAttachedContent && result.hasBaseTitle"
        if_action:
          find_match:
            - if_else:
                condition: "flags.local_search_enabled"
                if_action: attach_local_content_by_search
                else_action: unmatched
            # PornDB JAV search for xxx content (tries JAV-specific endpoint first):
            - if_else:
                condition: "flags.apis_enabled && flags.porndb_enabled && result.contentType == contentType.xxx"
                if_action: attach_porndb_jav_by_search
                else_action: unmatched
            # PornDB search for xxx content:
            - if_else:
                condition: "flags.apis_enabled && flags.porndb_enabled && result.contentType == contentType.xxx"
                if_action: attach_porndb_content_by_search
                else_action: unmatched
            # StashDB search for xxx content:
            - if_else:
                condition: "flags.apis_enabled && flags.stashdb_enabled && result.contentType == contentType.xxx"
                if_action: attach_stashdb_content_by_search
                else_action: unmatched
            # MusicBrainz search for music content:
            - if_else:
                condition: "flags.apis_enabled && flags.musicbrainz_enabled && result.contentType == contentType.music"
                if_action: attach_musicbrainz_content_by_search
                else_action: unmatched
            # Discogs search for music content:
            - if_else:
                condition: "flags.apis_enabled && flags.discogs_enabled && result.contentType == contentType.music"
                if_action: attach_discogs_content_by_search
                else_action: unmatched
            # Deezer search for music content:
            - if_else:
                condition: "flags.apis_enabled && flags.deezer_enabled && result.contentType == contentType.music"
                if_action: attach_deezer_content_by_search
                else_action: unmatched
            # OpenLibrary search for ebook/audiobook content:
            - if_else:
                condition: "flags.apis_enabled && flags.openlibrary_enabled && result.contentType in [contentType.ebook, contentType.audiobook]"
                if_action: attach_openlibrary_content_by_search
                else_action: unmatched
            # Google Books fallback for ebook/audiobook content:
            - if_else:
                condition: "flags.apis_enabled && flags.googlebooks_enabled && result.contentType in [contentType.ebook, contentType.audiobook]"
                if_action: attach_googlebooks_content_by_search
                else_action: unmatched
            # Comic Vine search for comic content:
            - if_else:
                condition: "flags.apis_enabled && flags.comicvine_enabled && result.contentType == contentType.comic"
                if_action: attach_comicvine_content_by_search
                else_action: unmatched
            # AniList manga fallback for comic content:
            - if_else:
                condition: "flags.apis_enabled && flags.anilist_enabled && result.contentType == contentType.comic"
                if_action: attach_anilist_manga_by_search
                else_action: unmatched
            # IGDB search for game content:
            - if_else:
                condition: "flags.apis_enabled && flags.igdb_enabled && result.contentType == contentType.game"
                if_action: attach_igdb_content_by_search
                else_action: unmatched
            # TMDB search for movie/tv/xxx content:
            - if_else:
                condition: "flags.apis_enabled && flags.tmdb_enabled"
                if_action: attach_tmdb_content_by_search
                else_action: unmatched
            # AniList anime fallback for tv_show content (after TMDB):
            - if_else:
                condition: "flags.apis_enabled && flags.anilist_enabled && result.contentType == contentType.tv_show"
                if_action: attach_anilist_content_by_search
                else_action: unmatched
            # Jikan (MAL) anime fallback for tv_show content (after AniList):
            - if_else:
                condition: "flags.apis_enabled && flags.jikan_enabled && result.contentType == contentType.tv_show"
                if_action: attach_jikan_content_by_search
                else_action: unmatched
    # delete specific content types based on the configured flags:
    - if_else:
        condition:
          or:
            - "result.contentType in flags.delete_content_types"
            - "flags.delete_xxx && result.contentType == contentType.xxx"
        if_action: delete
