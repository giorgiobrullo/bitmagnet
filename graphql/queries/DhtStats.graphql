query DhtStats {
  dht {
    stats {
      nodesCountIPv4
      nodesCountIPv6
      hashesCountIPv4
      hashesCountIPv6
      serverStartTime
      serverLastSuccess
      serverLastResponse
      crawlerActive
    }
  }
}

query DhtMetrics($input: DhtMetricsInput!) {
  dht {
    metrics(input: $input) {
      snapshots {
        bucket
        nodesIPv4
        nodesIPv6
        hashesIPv4
        hashesIPv6
      }
    }
  }
}
